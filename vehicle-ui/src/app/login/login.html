<div class="wrapper">
  <form #loginForm="ngForm" (ngSubmit)="onLogin()">
    <h2>Login</h2>

    <div class="input-field">
      <input 
        type="email" 
        name="email" 
        [(ngModel)]="email" 
        required 
        placeholder=" " />
      <label>Email Address</label>
    </div>

    <div class="input-field">
      <input 
        type="password" 
        name="password" 
        [(ngModel)]="password" 
        required 
        placeholder=" " />
      <label>Password</label>
    </div>

    <div class="forget">
      <label for="remember">
        <input type="checkbox" id="remember" name="rememberMe" [(ngModel)]="rememberMe">
        <p>Remember me</p>
      </label>
      <a href="#">Forgot Password?</a>
    </div>

    <button type="submit" [disabled]="!loginForm.valid || loading">
      {{ loading ? 'Logging in...' : 'Login' }}
    </button>

    @if (error) {
      <p class="error-msg">{{ error }}</p>
    }

    <div class="register">
      <p>Don't have an account? <a routerLink="/register">Sign Up</a></p>
    </div>
  </form>
</div>
