<div class="wrapper">
  <form #registerForm="ngForm" (ngSubmit)="register()">

    <h2>Register</h2>

    <div class="input-field">
      <input type="text" name="first_name" required [(ngModel)]="first_name" placeholder=" " />
      <label>First Name</label>
    </div>

    <div class="input-field">
      <input type="text" name="middle_name" [(ngModel)]="middle_name" placeholder=" " />
      <label>Middle Name (optional)</label>
    </div>

    <div class="input-field">
      <input type="text" name="last_name" required [(ngModel)]="last_name" placeholder=" " />
      <label>Last Name</label>
    </div>

    <div class="input-field">
      <input type="email" name="email" required email [(ngModel)]="email" placeholder=" " />
      <label>Email</label>
    </div>

    <div class="input-field">
      <input type="tel" name="phone" required [(ngModel)]="phone" placeholder=" " />
      <label>Phone Number</label>
    </div>
    <div class="input-field">
  <input
    type="password"
    id="password"
    required
    [(ngModel)]="password"
    name="password"
  />
  <label for="password">Password</label>
</div>

    <button type="submit" [disabled]="!registerForm.valid || loading">
      {{ loading ? 'Processing...' : 'Register' }}
    </button>

    @if (error) {
      <p class="error-msg">{{ error }}</p>
    }

    @if (success) {
      <p class="success-msg">{{ success }}</p>
    }

    <div class="login-link">
      <p>Already have an account? <a routerLink="/login">Login</a></p>
    </div>
  </form>
</div>
